name: Android CI & Invariant Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Verify, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' app/src/ build.gradle.kts settings.gradle.kts docs/ .github/; then
            echo "Error: Forbidden em dash or en dash detected!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."

      - name: Run Unit Tests and Invariant Audits
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Verify R8 Minification and Obfuscation Integrity
        run: ./gradlew minifyReleaseWithR8 --no-daemon --stacktrace

      - name: Assert R8 Obfuscation Mapping Contracts
        run: |
          echo "Verifying R8 mapping output contracts..."
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$MAPPING_FILE" ]; then
            echo "ERROR: R8 mapping file not found at $MAPPING_FILE"
            exit 1
          fi
          if ! grep -q "com.androgrid.v1.NodeCapabilities" "$MAPPING_FILE"; then
            echo "ERROR: NodeCapabilities not found in R8 mapping"
            exit 1
          fi
          if grep -q "isRooted_ ->" "$MAPPING_FILE"; then
            echo "ERROR: isRooted_ was renamed or obfuscated in R8 mapping"
            exit 1
          fi
          if grep -q "SubmitTaskRequest" "$MAPPING_FILE"; then
            echo "ERROR: SubmitTaskRequest was not tree-shaken by R8"
            exit 1
          fi
          echo "R8 mapping contracts verified successfully: reflection preserved, dead code tree-shaken."

      - name: Generate Dokka KDoc API Documentation
        run: ./gradlew dokkaHtml --no-daemon --stacktrace
