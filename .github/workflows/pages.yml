name: Deploy Android Worker Documentation to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Dokka & Android Documentation Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Dokka KDoc API Documentation
        run: ./gradlew dokkaHtml --no-daemon --stacktrace

      - name: Assemble Static Documentation Site
        run: python3 tools/docs/assemble_pages.py

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning generated site for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' site/; then
            echo "Error: Forbidden em dash or en dash detected in site/!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
